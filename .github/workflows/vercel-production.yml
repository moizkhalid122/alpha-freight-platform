name: Vercel Production Deploy

on:
  push:
    branches: [master, main]
    paths:
      - "alpha-freight-modern/**"
      - "vercel.json"
      - ".github/workflows/vercel-production.yml"
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_7BJOwabq6mPl3zguGfw8YDTb
      VERCEL_PROJECT_ID: prj_pVdwsX4a2WTL8escPw5BH0wORE2g
      PLATFORM_PUBLIC_MODE: warning_only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}